version: '3.9'

services:
  preference-service:
    build: .
    container_name: preference-service
    ports:
      - "50052:50052"
    depends_on:
      - postgres
    env_file:
      - .env



  postgres:
    image: postgres:16
    container_name: preference-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: preference_db


    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: