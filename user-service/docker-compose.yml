services:

  postgres:
    image: postgres:16
    container_name: user_service_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: tourism_ai
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: user_service_redis
    restart: always
    ports:
      - "6379:6379"

  user-service:
    build: .
    container_name: user_service
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - "50051:50051"
    env_file:
      - .env

volumes:
  postgres_data: