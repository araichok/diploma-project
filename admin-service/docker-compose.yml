services:
  admin-service:
    build: .
    container_name: admin_service
    restart: always
    depends_on:
      - postgres
    ports:
      - "8084:8084"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=12345
      - DB_NAME=admin_db

  postgres:
    image: postgres:16
    container_name: admin_postgres
    restart: always
    ports:
      - "5436:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=12345
      - POSTGRES_DB=admin_db
    volumes:
      - admin_postgres_data:/var/lib/postgresql/data

volumes:
  admin_postgres_data: