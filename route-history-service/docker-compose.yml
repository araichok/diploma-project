services:
  route-history-service:
    build: .
    container_name: route_history_service
    restart: always
    depends_on:
      - postgres
    ports:
      - "50056:50056"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=12345
      - DB_NAME=route_history_db

  postgres:
    image: postgres:16
    container_name: route_history_postgres
    restart: always
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=12345
      - POSTGRES_DB=route_history_db
    volumes:
      - route_history_postgres_data:/var/lib/postgresql/data

volumes:
  route_history_postgres_data: