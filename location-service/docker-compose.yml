services:

  location-postgres:
    image: postgres:16
    container_name: location-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: location_db

    ports:
      - "5434:5432"

    volumes:
      - location_postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql

  location-service:
    build: .
    container_name: location-service
    depends_on:
      - location-postgres
    ports:
      - "50054:50054"
    env_file:
      - .env
    environment:
      DB_HOST: location-postgres
      DB_PORT: 5432
    restart: always

volumes:
  location_postgres_data: